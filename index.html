<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050f">
<title>Sadia AI – Version X</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--rc:#00d2ff;--b:#00d2ff;--p:#a855f7;--g:#22ff88;--t:#e8f4ff}
body[data-s=speaking]{--rc:#22ff88}body[data-s=thinking]{--rc:#a855f7}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:var(--t);font-family:'Hind Siliguri',sans-serif;background:radial-gradient(ellipse at 25% 15%,#0b1f55 0,#030818 45%,#000 100%)}
#bg{position:fixed;inset:0;z-index:0;opacity:.7}
#app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
header>*{min-width:0}
header{display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--b),var(--p),transparent) 1}
.logo{font:800 21px Orbitron,sans-serif;background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.logo em{font-style:normal;color:#fff;-webkit-text-fill-color:#fff;text-shadow:0 0 12px var(--p)}
#agents{display:flex;gap:8px;flex:1;overflow-x:auto;justify-content:center;scrollbar-width:none}
#agents div{font:600 11px Orbitron,sans-serif;padding:7px 14px;border-radius:8px;border:1px solid rgba(80,120,255,.5);background:rgba(10,30,90,.35);white-space:nowrap;opacity:.7;transition:.3s;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#agents .work{opacity:1;border-color:var(--rc);color:#fff;background:rgba(0,210,255,.18);box-shadow:0 0 14px var(--rc)}
.sys{display:flex;gap:10px;font:600 12px Orbitron,sans-serif;opacity:.8;white-space:nowrap}
#stat{display:flex;align-items:center;gap:6px;font:600 13px Orbitron,sans-serif;white-space:nowrap;color:var(--rc)}
#stat i{width:9px;height:9px;border-radius:50%;background:var(--rc);box-shadow:0 0 10px var(--rc);animation:blink 1.4s infinite}
#gear{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--p);background:rgba(110,40,190,.25);color:#fff;font-size:16px}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;min-height:0}
.panel{position:relative;min-height:0;border-radius:22px;border:1px solid var(--rc);background:linear-gradient(160deg,rgba(10,25,70,.55),rgba(4,8,24,.65));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 0 24px rgba(0,210,255,.28),inset 0 0 34px rgba(168,85,247,.12);transition:border-color .4s}
.panel::before,.panel::after{content:"";position:absolute;width:22px;height:22px;border:3px solid var(--rc);pointer-events:none;z-index:3}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:22px}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:22px}
#left{overflow:hidden}
#left .glow{position:absolute;left:50%;top:44%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(var(--rc),transparent 68%);opacity:.22;animation:breathe 3s ease-in-out infinite}
.ring{position:absolute;left:50%;top:44%;aspect-ratio:1;border-radius:50%;pointer-events:none}
.r1{width:min(84%,360px);border:1.5px dashed var(--rc);opacity:.4;animation:spin 26s linear infinite}
.r2{width:min(96%,410px);border:2px dotted var(--p);opacity:.35;animation:spin 40s linear infinite reverse}
#stage,#face{position:absolute;inset:0 0 84px 0;width:100%;height:calc(100% - 84px)}
#face{object-fit:cover;object-position:center top;border-radius:22px 22px 0 0}
#stage svg{overflow:visible}
.brand{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 12px;display:flex;align-items:center;gap:12px;border-top:1px solid rgba(0,210,255,.25);background:linear-gradient(transparent,rgba(0,5,25,.85))}
.brand .ic{font-size:26px;color:var(--rc);text-shadow:0 0 14px var(--rc)}
.brand h1{font:800 clamp(20px,3.4vw,30px) Orbitron,sans-serif;color:#fff;text-shadow:0 0 14px var(--rc);line-height:1}
.brand p{font-size:12px;opacity:.85;margin-top:3px}
#right{display:flex;border-color:var(--p)}
#log{flex:1;min-width:0;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.6}
.m{max-width:88%;padding:10px 14px;white-space:pre-wrap;animation:in .3s;border:1px solid rgba(0,210,255,.5);background:rgba(0,40,110,.35);border-radius:4px 18px 18px 18px}
.m.u{align-self:flex-end;border-color:var(--p);background:rgba(110,40,190,.3);border-radius:18px 4px 18px 18px}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#chips button{flex:none;padding:8px 14px;border-radius:18px;border:1px solid rgba(0,210,255,.45);background:rgba(0,40,110,.35);color:var(--t);font:500 14px 'Hind Siliguri',sans-serif;white-space:nowrap}
#chips button:active{background:var(--b);color:#000}
#bar{min-width:0;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:40px;border:1px solid var(--b);background:rgba(6,14,40,.75);box-shadow:0 0 20px rgba(0,210,255,.3)}
#bar button{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--b);background:rgba(0,40,110,.4);color:var(--t);font-size:18px}
#mic{border-color:var(--p)!important;color:#fff;box-shadow:0 0 16px var(--p);animation:pulse2 2.2s infinite;width:56px!important;height:56px!important}
#mic.on{background:var(--p)!important}
#send{background:linear-gradient(135deg,#0a6cff,var(--b))!important;width:62px!important;border-radius:26px!important}
#inp{flex:1;min-width:0;height:48px;padding:0 18px;border-radius:26px;border:1px solid rgba(0,210,255,.5);background:rgba(0,0,0,.35);color:var(--t);font:500 17px 'Hind Siliguri',sans-serif;outline:none}
#inp:focus{box-shadow:0 0 14px var(--b)}
#vis{display:flex;align-items:center;gap:3px;height:40px}
#vis b{width:3px;height:6px;border-radius:2px;background:linear-gradient(var(--p),var(--b));animation:bar 1s ease-in-out infinite;animation-play-state:paused}
body[data-s=speaking] #vis b,body[data-s=listening] #vis b{animation-play-state:running}
#cam{position:fixed;top:70px;right:16px;width:100px;border:1.5px solid var(--b);border-radius:12px;z-index:5;box-shadow:0 0 14px var(--b)}
#sheet{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;padding:16px;border-radius:22px;border:1px solid var(--p);background:rgba(6,10,32,.94);backdrop-filter:blur(18px);box-shadow:0 0 30px rgba(168,85,247,.5);display:flex;flex-direction:column;gap:12px}
#sheet[hidden]{display:none}
#sheet h3{font:700 15px Orbitron,sans-serif;color:var(--b)}
#sheet .row{display:flex;gap:8px;flex-wrap:wrap}
#sheet button{padding:10px 14px;border-radius:12px;border:1px solid rgba(0,210,255,.5);background:rgba(0,40,110,.35);color:var(--t);font:500 15px 'Hind Siliguri',sans-serif}
#sheet button.on{background:var(--b);color:#00121a;font-weight:600}
#sheet input[type=range]{width:100%;accent-color:var(--p)}
#sheet small{opacity:.7;font-size:13px}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes breathe{50%{opacity:.4;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes blink{50%{opacity:.4}}
@keyframes pulse2{50%{box-shadow:0 0 30px var(--p)}}
@keyframes bar{50%{height:36px}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:820px){
 main{grid-template-columns:minmax(0,1fr);grid-template-rows:44% minmax(0,1fr)}
 .logo{font-size:15px}.sys{display:none}#agents{justify-content:flex-start}#agents div{padding:6px 10px;font-size:10px}
 #vis{display:none}#bar{gap:6px}#bar button{width:42px;height:42px}#mic{width:48px!important;height:48px!important}#send{width:50px!important}
 #log{font-size:16px}#stage,#face{bottom:64px;height:calc(100% - 64px)}.brand{padding:6px 12px}.brand .ic{font-size:20px}
}
</style>
</head>
<body>
<div id="err" style="display:none;position:fixed;z-index:99;left:8px;right:8px;top:8px;padding:10px;border-radius:10px;background:#7a0020;color:#fff;font:13px monospace;white-space:pre-wrap"></div>
<script>
function vxErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent+=m+'\n'}
addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'){vxErr('ফাইল পাওয়া যায়নি: '+e.target.getAttribute('src'))}else{vxErr((e.message||'ত্রুটি')+' ['+String(e.filename||'').split('/').pop()+':'+(e.lineno||'')+']')}},true);
</script>
<canvas id="bg"></canvas>
<div id="app">
  <header>
    <div class="logo">VERSION <em>X</em></div>
    <nav id="agents"></nav>
    <div class="sys"><span id="clock"></span><span id="batt"></span></div>
    <div id="stat"><i></i><span id="state">IDLE</span></div>
    <button id="gear" title="সেটিংস"><i class="fa-solid fa-gear"></i></button>
  </header>
  <main>
    <section id="left" class="panel">
      <div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div>
      <div id="stage"></div>
      <img id="face" src="assets/sadia.png" alt="Sadia" onerror="this.remove()">
      <div class="brand"><i class="fa-solid fa-crown ic"></i><div><h1>SADIA AI</h1><p>Your Personal AI Assistant</p></div></div>
    </section>
    <section id="right" class="panel">
      <div id="log"><div class="m a">হ্যালো! আমি সাদিয়া 💙
আমি Version X-এর AI সহকারী। আপনি কেমন আছেন?</div></div>
    </section>
  </main>
  <div id="chips">
    <button data-c="flash">🔦 টর্চ</button><button data-c="volume" data-a="70">🔊 ভলিউম</button><button data-c="settings" data-a="wifi">📶 ওয়াই-ফাই</button>
    <button data-c="open" data-a="YouTube">▶ ইউটিউব</button><button data-c="remind" data-a="5" data-b="৫ মিনিট হয়ে গেছে">⏰ ৫ মিনিট</button><button data-c="battery">🔋 ব্যাটারি</button>
  </div>
  <footer id="bar">
    <button id="mic" title="মাইক"><i class="fa-solid fa-microphone"></i></button>
    <button id="camb" title="ক্যামেরা"><i class="fa-solid fa-camera"></i></button>
    <input id="inp" placeholder="সাদিয়াকে বলুন..." autocomplete="off">
    <button id="send" title="পাঠান"><i class="fa-solid fa-paper-plane"></i></button>
    <button id="stop" title="থামান"><i class="fa-solid fa-stop"></i></button>
    <div id="vis"></div>
  </footer>
</div>
<div id="sheet" hidden>
  <h3>ভয়েস সেটিংস</h3>
  <div class="row"><button data-v="auto">🤝 হাইব্রিড</button><button data-v="sadia">✨ সাদিয়া ভয়েস</button><button data-v="google">🔈 গুগল ভয়েস</button></div>
  <small>হাইব্রিড: আগে সাদিয়ার নিজস্ব ভয়েস, না পেলে ফোনের গুগল ভয়েস। শোনা ভয়েস ফোনে জমা থাকে, তাই আবার বললে নেট ছাড়াই বাজে।</small>
  <label>কথার গতি<input id="rate" type="range" min=".8" max="1.3" step=".05" value="1"></label>
  <div class="row"><button id="vtest">🔊 পরীক্ষা করুন</button><button id="sclose">✕ বন্ধ</button></div>
</div>
<video id="cam" playsinline muted hidden></video>
<script>
(()=>{
const st=document.getElementById('state');
new MutationObserver(()=>document.body.dataset.s=st.textContent.toLowerCase()).observe(st,{childList:true,characterData:true,subtree:true});
const vis=document.getElementById('vis');for(let i=0;i<22;i++){const b=document.createElement('b');b.style.animationDelay=(i*.07)+'s';vis.append(b)}
const ck=()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'});ck();setInterval(ck,30000);
navigator.getBattery?.().then(b=>{const u=()=>document.getElementById('batt').textContent='🔋'+Math.round(b.level*100)+'%';u();b.onlevelchange=u});
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,W/10|0)},()=>({x:Math.random()*W,y:Math.random()*H,v:.15+Math.random()*.4,r:Math.random()*1.6+.4}))}
addEventListener('resize',rs);rs();
(function f(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(0,210,255,.6)';for(const p of P){p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W}cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}requestAnimationFrame(f)})();
})();
</script>
<script src="js/avatar.js"></script>
<script src="js/about.js"></script>
<script src="js/app.js"></script>
</body>
</html>
